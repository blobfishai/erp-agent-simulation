description = "**Alderwood Furniture · Binh Duong factory · Effective-dated price batch**  Pricing sent the Q2 list-price batch for Alderwood Furniture. Apply only the lines that meet policy: items we actually carry, effective dates that are not already past, and changes inside the approved band, and respect a later effective date when one line supersedes an earlier one for the same item. Update the prices we accept, log accepted and rejected lines with reasons in the register, and prepare the notice for review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
