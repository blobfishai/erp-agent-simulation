schema_version = "1.4"

[task]
name = "blobfishai/erpbench-054"
version = "1.0.0"
description = "**Alderwood Furniture · Binh Duong factory · Reorder monitoring and requisition**  Planning wants the reorder run for the Binh Duong factory done today. Work out which items are genuinely below their reorder point once reservations and open purchase orders are counted, how much each needs to come back to its planned level, and whether Mekong Hardwood Mills can deliver inside the 10-day window or whether an expedite option is worth raising. Raise the requisition that current policy supports, log it in the register, and post the planning update for review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
authors = [{ name = "Blobfish AI" }]
keywords = ["erp", "oracle-fusion", "order-to-cash", "procure-to-pay", "multi-system", "stateful", "deterministic"]

