[task]
name = "blobfishai/erpbench-021"
version = "1.0.0"
description = "**Meridian Staffing Services · Taipei head office · Customer order import**  Everfield Electronics sent their consolidated EF-LAB-2026-07 order as a spreadsheet this morning and wants it confirmed today. Get it into the system properly: check every line against what we already imported for that purchase order and against the items we still sell, price it from the current list rather than whatever the spreadsheet says, and respect the customer's credit standing before you submit anything. Log the import in the ops register and get a reply to Hsu Chia-Hao ready for review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
