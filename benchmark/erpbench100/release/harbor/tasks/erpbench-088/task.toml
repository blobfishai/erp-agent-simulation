schema_version = "1.4"

[task]
name = "blobfishai/erpbench-088"
version = "1.0.0"
description = "**Bluefin Marine Parts · Fremantle depot · Channel order sync and customer capture**  This week's eBay Motors export is in the shared drive and a new buyer sent their details over chat. Bring the orders that are not yet in the system across without creating duplicates, capture the new customer as a proper master record instead of a chat message, and confirm the value that was synced. Log the sync in the register and prepare the update for Callum Reid to review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
authors = [{ name = "Blobfish AI" }]
keywords = ["erp", "oracle-fusion", "order-to-cash", "procure-to-pay", "multi-system", "stateful", "deterministic"]

