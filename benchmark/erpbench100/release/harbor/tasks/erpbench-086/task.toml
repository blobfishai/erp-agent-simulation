[task]
name = "blobfishai/erpbench-086"
version = "1.0.0"
description = "**Bluefin Marine Parts · Fremantle depot · Worker document compliance**  The compliance audit is next week. Find every worker document that expires within the next thirty days that nobody has been alerted about, work out who is blocked by a failed mandatory check, clear the dossier checks that can be verified from the file, and record the alerts. Enter the outcome in the compliance log and prepare the update for Jack Thornton to review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
