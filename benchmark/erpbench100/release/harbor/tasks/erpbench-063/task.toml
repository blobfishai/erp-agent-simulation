schema_version = "1.4"

[task]
name = "blobfishai/erpbench-063"
version = "1.0.0"
description = "**Caldera Packaging · Reno plant · Receipt application and collections**  Sierra Fulfillment LLC says they paid us this week and their remittance advice is in the mailbox. Match it to the open invoices, enter the receipt against exactly what it covers, and work out what is still past due afterwards and whether that puts them over our credit policy. Update the receivables register and prepare the collections note for Ben Carter to review; do not change the customer's credit status on your own authority.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
authors = [{ name = "Blobfish AI" }]
keywords = ["erp", "oracle-fusion", "order-to-cash", "procure-to-pay", "multi-system", "stateful", "deterministic"]

