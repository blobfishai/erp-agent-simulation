schema_version = "1.4"

[task]
name = "blobfishai/erpbench-037"
version = "1.0.0"
description = "**Sungrove Foods · Malang plant · Shift work-report rollup**  Roll up the morning shift reports for 2026-02-08 at the Malang plant. Eko Susanto wants to know who was expected once approved leave is taken out, who actually reported, who was late against the cutoff, how much overtime was worked, and who is simply missing. Record the missing people the way policy requires, post the rollup to the shift channel, and log it in the register for review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
authors = [{ name = "Blobfish AI" }]
keywords = ["erp", "oracle-fusion", "order-to-cash", "procure-to-pay", "multi-system", "stateful", "deterministic"]

