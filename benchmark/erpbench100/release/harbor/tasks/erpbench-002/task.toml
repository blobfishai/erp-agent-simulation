schema_version = "1.4"

[task]
name = "blobfishai/erpbench-002"
version = "1.0.0"
description = "**Northbridge Fastener Works · Toledo plant · Shipment verification**  Shipment SHP-NBR-4471 for Cascade Assembly Inc. is staged for tonight's truck, but the warehouse pick confirmation and the shipment lines in the system do not agree everywhere. Reconcile them line by line, correct what the pick confirmation proves was actually picked, hold anything that looks over-picked instead of shipping it, and confirm the value we can honestly ship. Record it in the shipping register and leave the update for Marcus Lee ready for review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
authors = [{ name = "Blobfish AI" }]
keywords = ["erp", "oracle-fusion", "order-to-cash", "procure-to-pay", "multi-system", "stateful", "deterministic"]

