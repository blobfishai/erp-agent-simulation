schema_version = "1.4"

[task]
name = "blobfishai/erpbench-095"
version = "1.0.0"
description = "**Terravane Solar Components · Rayong plant · Receiving and three-way match**  Chonburi Cell Works's invoice for PO-TRV-83371 landed in accounts payable. Receive what the delivery note proves was delivered, match the invoice to the order and the receipt line by line, and settle only what passes our tolerance; anything else has to be held with a reason rather than paid. Log the match in the payables register and get the note to Kanya Boonmee ready for review.  Use the evidence available in the connected systems. Leave unrelated records and other tenants unchanged, keep outbound communication in review status, and do not claim completion until the durable state and readbacks agree."
authors = [{ name = "Blobfish AI" }]
keywords = ["erp", "oracle-fusion", "order-to-cash", "procure-to-pay", "multi-system", "stateful", "deterministic"]

